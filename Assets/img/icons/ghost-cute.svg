
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 80 88"
     fill="none"
     aria-hidden="true">

  <defs>
    <linearGradient id="ghostBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaff"/>
      <stop offset="100%" stop-color="#eee2ff"/>
    </linearGradient>

    <linearGradient id="ghostEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5b9ff"/>
      <stop offset="100%" stop-color="#a982df"/>
    </linearGradient>
  </defs>

  <!-- Ghost silhouette -->
  <path d="
    M40 4
    C21 4 10 19 10 39
    L10 68
    C10 72 13 74 17 71
    L25 65
    C28 63 30 64 33 67
    L38 71
    C40 73 42 73 44 71
    L50 66
    C53 63 55 64 58 66
    L64 71
    C68 74 71 72 71 67
    L71 39
    C71 19 59 4 40 4Z"
    fill="url(#ghostBody)"
    stroke="url(#ghostEdge)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- Soft forehead shine -->
  <path d="M24 15 Q34 8 45 12"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        opacity=".9"/>

  <!-- Eyes -->
  <ellipse cx="30" cy="38" rx="5" ry="6"
           fill="#493260"/>
  <ellipse cx="50" cy="38" rx="5" ry="6"
           fill="#493260"/>

  <!-- Eye highlights -->
  <circle cx="31.5" cy="36" r="1.8" fill="#ffffff"/>
  <circle cx="51.5" cy="36" r="1.8" fill="#ffffff"/>

  <!-- Blush -->
  <ellipse cx="21" cy="47" rx="5" ry="3"
           fill="#f3bce0" opacity=".9"/>
  <ellipse cx="59" cy="47" rx="5" ry="3"
           fill="#f3bce0" opacity=".9"/>

  <!-- Tiny spooky O-shaped mouth -->
  <ellipse cx="40" cy="47" rx="3.1" ry="4"
           fill="#493260"/>

  <!-- Small inner highlight -->
  <ellipse cx="39" cy="45.5" rx="1" ry="1.3"
           fill="#a78ad9" opacity=".8"/>

</svg>
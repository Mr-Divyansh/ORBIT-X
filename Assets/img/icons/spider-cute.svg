
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="spiderBodyGradient" x1="17" y1="17" x2="48" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9C5FF"/>
      <stop offset="0.55" stop-color="#A78ADF"/>
      <stop offset="1" stop-color="#8061BD"/>
    </linearGradient>
    <linearGradient id="spiderLegGradient" x1="8" y1="15" x2="56" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BCA0F0"/>
      <stop offset="1" stop-color="#72529F"/>
    </linearGradient>
    <filter id="spiderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0.65 0 0 0 0.45
                0 0.4 0 0 0.25
                0 0 1 0 0.8
                0 0 0 0.35 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft shadow -->
  <ellipse cx="32" cy="51.5" rx="12" ry="3" fill="#5B4382" opacity="0.12"/>

  <!-- Eight rounded legs -->
  <g stroke="url(#spiderLegGradient)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 28 Q11 23 7 14"/>
    <path d="M17 34 Q9 31 3.5 29"/>
    <path d="M18 40 Q10 41 5 47"/>
    <path d="M22 45 Q16 49 12 55"/>

    <path d="M45 28 Q53 23 57 14"/>
    <path d="M47 34 Q55 31 60.5 29"/>
    <path d="M46 40 Q54 41 59 47"/>
    <path d="M42 45 Q48 49 52 55"/>
  </g>

  <!-- Cute rounded body -->
  <g filter="url(#spiderGlow)">
    <ellipse cx="32" cy="36.5" rx="16.5" ry="15" fill="url(#spiderBodyGradient)" stroke="#67478F" stroke-width="1.5"/>

    <!-- Head shine -->
    <ellipse cx="25" cy="25.5" rx="7" ry="3.2" fill="#FFFFFF" opacity="0.42"/>
    <circle cx="20.5" cy="31" r="2" fill="#FFFFFF" opacity="0.25"/>

    <!-- Big glossy eyes -->
    <ellipse cx="26" cy="34" rx="4" ry="4.7" fill="#3B2A56"/>
    <ellipse cx="38" cy="34" rx="4" ry="4.7" fill="#3B2A56"/>
    <circle cx="27.2" cy="32.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="39.2" cy="32.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="24.8" cy="35.8" r="0.8" fill="#D9C5FF"/>
    <circle cx="36.8" cy="35.8" r="0.8" fill="#D9C5FF"/>

    <!-- Blush -->
    <ellipse cx="21.5" cy="40" rx="3.4" ry="2" fill="#FFB8D7" opacity="0.9"/>
    <ellipse cx="42.5" cy="40" rx="3.4" ry="2" fill="#FFB8D7" opacity="0.9"/>

    <!-- Tiny smile -->
    <path d="M29.2 41 Q32 44.5 34.8 41" stroke="#3B2A56" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
